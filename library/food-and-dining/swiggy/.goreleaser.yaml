version: 2
project_name: swiggy-pp-cli
changelog:
  disable: true
builds:
  - id: swiggy-pp-cli
    main: ./cmd/swiggy-pp-cli
    binary: swiggy-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/food-and-dining/swiggy/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: swiggy-pp-mcp
    main: ./cmd/swiggy-pp-mcp
    binary: swiggy-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: swiggy-pp-cli
    repository:
      owner: somsamantray
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Swiggy Builders Club tool, one persistent OAuth session, and a local order history no Swiggy surface shows you."
    install: |
      bin.install "swiggy-pp-cli"
      bin.install "swiggy-pp-mcp"
